<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{blog_title}}｜Wash Peaks</title>
<meta name="description" content="Wash Peaksのお知らせ、導入事例、業務用洗濯やコインランドリー開業に役立つコラムをお届けします。">
<link rel="stylesheet" href="{{root}}css/style.css">
</head>
<body data-section="blog/index.html">
{{header}}

<main>
  <section class="page-hero">
    <div class="page-hero-bg" style="background-image:url({{root}}img/s1.jpg)"></div>
    <div class="wrap">
      <p class="en">Blog</p>
      <h1>{{blog_title}}</h1>
      <p>お知らせ、導入事例、業務用洗濯やコインランドリー開業に役立つ情報をお届けします。</p>
    </div>
  </section>
  <div class="wrap breadcrumb"><a href="{{root}}index.html">TOP</a> ／ {{blog_title}}</div>

  <section class="section">
    <div class="wrap">
      <div class="filter" data-target="#post-grid">{{filters}}</div>
      <div class="case-grid" id="post-grid">{{cards}}</div>
      {{empty}}
    </div>
  </section>

  {{cta}}
</main>

{{footer}}
<script src="{{root}}js/common.js"></script>
</body>
</html>
