<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}｜Wash Peaks</title>
<meta name="description" content="{{description}}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{og_image}}">
<link rel="canonical" href="{{canonical}}">
<link rel="stylesheet" href="{{root}}css/style.css">
</head>
<body data-section="blog/index.html">
{{header}}

<main>
  <section class="page-hero">
    <div class="page-hero-bg" style="background-image:url({{cover}})"></div>
    <div class="wrap">
      <p class="en">{{category}}</p>
      <h1>{{title}}</h1>
      <p><time datetime="{{date}}">{{date_ja}}</time></p>
    </div>
  </section>
  <div class="wrap breadcrumb"><a href="{{root}}index.html">TOP</a> ／ <a href="index.html">{{blog_title}}</a> ／ {{title}}</div>

  <section class="section">
    <article class="wrap article">
      {{body}}
      <p class="tags">{{tags}}</p>
    </article>
  </section>

  <section class="section">
    <div class="wrap">
      <h2 class="section-title">最近の記事<small>RECENT</small></h2>
      <div class="case-grid">{{recent}}</div>
      <p style="text-align:center;margin-top:32px"><a class="btn btn-outline" href="index.html">記事一覧へ <span class="arrow"></span></a></p>
    </div>
  </section>

  {{cta}}
</main>

{{footer}}
<script src="{{root}}js/common.js"></script>
</body>
</html>
